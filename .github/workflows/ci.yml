name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_campus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_campus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Apply database migrations
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: |
          for migration in ../migrations/00*.sql; do
            psql --host localhost --username postgres --dbname smart_campus --file "$migration"
          done
      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/smart_campus
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: smart-campus-test-secret-with-at-least-32-characters
        run: ./mvnw --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build -- --webpack
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Playwright browser
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run workspace smoke tests
        working-directory: tests
        run: npm run test:workspace
