name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: ${{ secrets.CI_DB_URL }}
      DB_USER: ${{ secrets.CI_DB_USER }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25 # khớp java.version trong backend/pom.xml
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit-coverage
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports

  # Test API: bật backend thật rồi chạy Playwright project "api"
  api-tests:
    runs-on: ubuntu-latest
    # Connect to an already provisioned test database; CI does not create or migrate it.
    env:
      DB_URL: ${{ secrets.CI_DB_URL }}
      DB_USER: ${{ secrets.CI_DB_USER }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      TEST_ADMIN_EMAIL: ${{ secrets.CI_TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.CI_TEST_ADMIN_PASSWORD }}
      TEST_TEACHER_EMAIL: ${{ secrets.CI_TEST_TEACHER_EMAIL }}
      TEST_TEACHER_PASSWORD: ${{ secrets.CI_TEST_TEACHER_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.CI_TEST_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.CI_TEST_STUDENT_PASSWORD }}
      TEST_STUDENT2_EMAIL: ${{ secrets.CI_TEST_STUDENT2_EMAIL }}
      TEST_STUDENT2_PASSWORD: ${{ secrets.CI_TEST_STUDENT2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Validate configured test environment
        run: |
          for name in DB_URL DB_USER DB_PASSWORD JWT_SECRET TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD TEST_TEACHER_EMAIL TEST_TEACHER_PASSWORD TEST_STUDENT_EMAIL TEST_STUDENT_PASSWORD TEST_STUDENT2_EMAIL TEST_STUDENT2_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required CI secret for $name"; exit 1; fi
          done
      - name: Build và chạy backend
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/*.jar > ../backend.log 2>&1 &
      - name: Chờ backend sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "Backend OK"; exit 0
            fi
            sleep 2
          done
          echo "Backend không khởi động được"; cat backend.log; exit 1
      - name: Cài PostgreSQL client cho fixture kiểm thử
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Tạo fixture QR và buổi học đã kết thúc
        working-directory: tests
        run: bash scripts/provision-attendance-fixtures.sh
        env:
          DB_URL: ${{ secrets.CI_DB_URL }}
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.CI_TEST_ADMIN_EMAIL }}
          TEST_TEACHER_EMAIL: ${{ secrets.CI_TEST_TEACHER_EMAIL }}
          TEST_STUDENT_EMAIL: ${{ secrets.CI_TEST_STUDENT_EMAIL }}
          TEST_STUDENT2_EMAIL: ${{ secrets.CI_TEST_STUDENT2_EMAIL }}
      - name: Chạy API test
        working-directory: tests
        env:
          API_URL: http://localhost:8080
          SKIP_WEB_SERVER: "true"
        run: |
          npm ci
          npx playwright test --project=api
      - name: Cài frontend và Chromium cho E2E với backend thật
        run: |
          npm --prefix frontend ci
          cd tests
          npx playwright install --with-deps chromium
      - name: Chạy E2E với backend thật
        working-directory: tests
        env:
          BACKEND_URL: http://localhost:8080
          TEST_STUDENT_EMAIL: ${{ secrets.CI_TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.CI_TEST_STUDENT_PASSWORD }}
        run: npx playwright test --project=e2e-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: |
            tests/playwright-report
            backend.log

  # Test E2E: Playwright tự bật frontend (webServer trong playwright.config.ts)
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
      - name: Cài frontend
        working-directory: frontend
        run: npm ci
      - name: Cài tests và trình duyệt
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Chạy E2E test (sanity, login, schedule và nghiệp vụ)
        working-directory: tests
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: tests/playwright-report
