name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25 # khớp java.version trong backend/pom.xml
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit-coverage
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports

  # Test API: bật backend thật rồi chạy Playwright project "api"
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_campus_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_campus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/smart_campus_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      TEST_ADMIN_EMAIL: admin@smartcampus.test
      TEST_ADMIN_PASSWORD: Admin@123
      TEST_TEACHER_EMAIL: teacher@smartcampus.test
      TEST_TEACHER_PASSWORD: Teacher@123
      TEST_STUDENT_EMAIL: student@smartcampus.test
      TEST_STUDENT_PASSWORD: Student@123
      TEST_STUDENT2_EMAIL: student2@smartcampus.test
      TEST_STUDENT2_PASSWORD: Student@123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Cài PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Tạo schema và dữ liệu CI
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: smart_campus_ci
          PGUSER: postgres
          PGPASSWORD: ci-only-password
        run: |
          for migration in database/migrations/[0-9][0-9][0-9]_*.sql; do
            echo "Applying $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration" > /dev/null
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/ci-base.sql > /dev/null
      - name: Build và chạy backend
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/*.jar > ../backend.log 2>&1 &
      - name: Chờ backend sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "Backend OK"; exit 0
            fi
            sleep 2
          done
          echo "Backend không khởi động được"; cat backend.log; exit 1
      - name: Tạo fixture QR và buổi học đã kết thúc
        working-directory: tests
        run: bash scripts/provision-attendance-fixtures.sh
      - name: Chạy API test
        working-directory: tests
        env:
          API_URL: http://localhost:8080
          SKIP_WEB_SERVER: "true"
        run: |
          npm ci
          npx playwright test --project=api
      - name: Cài frontend và Chromium cho E2E với backend thật
        run: |
          npm --prefix frontend ci
          cd tests
          npx playwright install --with-deps chromium
      - name: Chạy E2E với backend thật
        working-directory: tests
        env:
          BACKEND_URL: http://localhost:8080
        run: npx playwright test --project=e2e-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: |
            tests/playwright-report
            backend.log

  # Test E2E: Playwright tự bật frontend (webServer trong playwright.config.ts)
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
      - name: Cài frontend
        working-directory: frontend
        run: npm ci
      - name: Cài tests và trình duyệt
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Chạy E2E test (sanity, login, schedule và nghiệp vụ)
        working-directory: tests
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: tests/playwright-report
