components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        status:
          type: "integer"
        message:
          type: "string"
      required:
        - "status"
        - "message"
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    LoginResponse:
      type: "object"
      properties:
        accessToken:
          type: "string"
        expiresAt:
          type: "string"
          format: "date-time"
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
        roles:
          type: "array"
          items:
            type: "string"
      required:
        - "accessToken"
        - "expiresAt"
        - "id"
        - "name"
        - "email"
        - "roles"
    ActivateRequest:
      type: "object"
      properties:
        token:
          type: "string"
        password:
          type: "string"
      required:
        - "token"
        - "password"
    InviteRequest:
      type: "object"
      properties:
        code:
          type: "string"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
        role:
          type: "string"
          enum:
            - "STUDENT"
            - "TEACHER"
        faculty:
          type: "string"
      required:
        - "code"
        - "name"
        - "email"
        - "role"
        - "faculty"
    InviteResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        email:
          type: "string"
        role:
          type: "string"
        faculty:
          type: "string"
    Profile:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        code:
          type: "string"
        name:
          type: "string"
        email:
          type: "string"
        faculty:
          type: "string"
        roles:
          type: "array"
          items:
            type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        verified:
          type: "boolean"
        birthDate:
          type: "string"
          format: "date"
        phone:
          type: "string"
        personalEmail:
          type: "string"
        className:
          type: "string"
        entryYear:
          type: "integer"
    PublicTeacher:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        code:
          type: "string"
        name:
          type: "string"
        email:
          type: "string"
        faculty:
          type: "string"
    UpdateProfile:
      type: "object"
      properties:
        name:
          type: "string"
        birthDate:
          type: "string"
          format: "date"
        phone:
          type: "string"
        personalEmail:
          type: "string"
        className:
          type: "string"
        entryYear:
          type: "integer"
      required:
        - "name"
    ChangePassword:
      type: "object"
      properties:
        currentPassword:
          type: "string"
        newPassword:
          type: "string"
          minLength: 8
      required:
        - "currentPassword"
        - "newPassword"
    AdminUser:
      type: "object"
