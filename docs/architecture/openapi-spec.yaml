      tags:
        - "Student intake"
      summary: "Retry account creation for a failed submission (admin)"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/StudentIntakeCreated"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
