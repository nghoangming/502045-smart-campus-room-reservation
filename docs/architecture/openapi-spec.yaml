                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{id}:
    get:
      tags:
        - "Rooms"
      summary: "Get room"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - "Rooms"
      summary: "Update room (admin)"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RoomWrite"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
