        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - "Rooms"
      summary: "Create room and physical seats (admin)"
      x-implementation-status: "implemented"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RoomWrite"
      responses:
        "201":
          description: "Success"
          content:
