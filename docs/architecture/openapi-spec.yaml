openapi: "3.1.0"
info:
  title: "Smart Campus API"
  version: "2.0.0"
  description: "Contract synchronized with the private Spring Boot backend. x-implementation-status distinguishes implemented operations from retained future ideas. Except public operations, requests require Bearer JWT. Student timetable is scoped by faculty, not individual course enrollment."
servers:
  - url: "http://localhost:8080/api/v1"
security:
  - bearerAuth: []
tags:
  - name: "Health"
  - name: "Authentication"
  - name: "Accounts"
  - name: "Student intake"
  - name: "Rooms"
  - name: "Class sessions"
  - name: "Reservations"
  - name: "Seats"
  - name: "Attendance"
  - name: "Absence"
  - name: "Incidents"
  - name: "Resources"
  - name: "Notifications"
  - name: "Planned"
paths:
  /health:
    get:
      tags:
        - "Health"
      summary: "Backend health"
      x-implementation-status: "implemented"
      description: "Returns plain text smart-campus-backend"
      security: []
      responses:
        "200":
          description: "Backend running"
          content:
            "text/plain":
              schema:
                type: "string"
  /auth/login:
    post:
      tags:
        - "Authentication"
      summary: "Login with verified email and password"
      x-implementation-status: "implemented"
      description: "JWT expires after one hour."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/activate:
    post:
      tags:
        - "Authentication"
      summary: "Activate invited account"
      x-implementation-status: "implemented"
      description: "Activation token is single-use and valid for 24 hours."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "204":
          description: "No content"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/invitations:
    post:
      tags:
        - "Accounts"
      summary: "Invite student or teacher by school email"
      x-implementation-status: "implemented"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      tags:
        - "Accounts"
      summary: "List users (admin); optional exact faculty name"
      x-implementation-status: "implemented"
      parameters:
        - name: "faculty"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AdminUser"
        "400":
          description: "Invalid request"
          content:
            "application/json":
