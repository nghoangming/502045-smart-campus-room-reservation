      summary: "Change own password"
      x-implementation-status: "implemented"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "204":
          description: "No content"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/faculty:
    patch:
      tags:
        - "Accounts"
      summary: "Assign student faculty (admin)"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateFaculty"
      responses:
        "200":
          description: "Success"
          content:
