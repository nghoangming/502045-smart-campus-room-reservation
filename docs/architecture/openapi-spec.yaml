        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - "Rooms"
      summary: "Update room (admin)"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RoomWrite"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - "Planned"
      summary: "Room deletion is not implemented"
      x-implementation-status: "planned"
      description: "Not exposed by the current backend. Room deletion is not implemented"
      responses:
        "404":
          description: "No matching backend endpoint"
  /rooms/{id}/schedule:
    get:
      tags:
        - "Rooms"
      summary: "List active bookings overlapping a date"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "date"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/RoomSchedule"
        "400":
          description: "Invalid request"
          content:
            "application/json":
