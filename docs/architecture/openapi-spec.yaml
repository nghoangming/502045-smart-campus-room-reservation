                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Resource not found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /class-sessions/{id}/absence:
    patch:
      tags:
        - "Absence"
      summary: "Teacher requests absence before one-hour deadline"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "reason"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Success"
          content:
