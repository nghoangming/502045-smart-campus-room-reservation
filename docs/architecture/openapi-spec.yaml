              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms:
    get:
      tags:
        - "Rooms"
      summary: "List all rooms"
      x-implementation-status: "implemented"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Room"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
