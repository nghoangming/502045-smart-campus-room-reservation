        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me/password:
    post:
      tags:
