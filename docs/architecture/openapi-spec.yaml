              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
