  /intake/students/import:
    post:
      tags:
        - "Student intake"
      summary: "Import Google Forms CSV and create student accounts"
      x-implementation-status: "implemented"
      description: "Admin only. Maximum 1 MB; result includes success or error per row."
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                file:
                  type: "string"
                  format: "binary"
              required:
                - "file"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/StudentIntakeImport"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
