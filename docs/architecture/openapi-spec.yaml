  /rooms/availability:
    get:
      tags:
        - "Rooms"
      summary: "List active rooms without booking in interval"
      x-implementation-status: "implemented"
      description: "Public GET; startTime must precede endTime."
      security: []
      parameters:
        - name: "date"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
        - name: "startTime"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "time"
        - name: "endTime"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "time"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Room"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /class-sessions:
    get:
      tags:
        - "Class sessions"
      summary: "List sessions scoped to caller role"
      x-implementation-status: "implemented"
      description: "Students see approved faculty sessions; teachers see their own; from and to must both be supplied and span at most 32 days."
      parameters:
        - name: "date"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ClassSession"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - "Class sessions"
      summary: "Create session for teacher-owned classroom booking"
      x-implementation-status: "implemented"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ClassSessionRequest"
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ClassSession"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication required"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Insufficient permission"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Business conflict"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /class-sessions/{id}:
    get:
      tags:
        - "Class sessions"
      summary: "Get visible session"
      x-implementation-status: "implemented"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
