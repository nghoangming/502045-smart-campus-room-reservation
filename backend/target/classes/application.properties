spring.application.name=smart-campus-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CNPM}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# SQL files are applied manually in pgAdmin for this project.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migrations
# Preserve the existing 001_name.sql / 002_name.sql naming convention.
spring.flyway.sql-migration-prefix=
spring.flyway.sql-migration-separator=_
spring.flyway.repeatable-sql-migration-prefix=R
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
app.auth.jwt-secret=${AUTH_JWT_SECRET}
