# Integration tests use a separate database, never the default local CNPM database.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/smart_campus_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
app.auth.jwt-secret=${AUTH_JWT_SECRET:smart-campus-isolated-integration-test-key-2026}
